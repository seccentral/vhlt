name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cxx: [g++, clang++]
        include:
          - os: windows-latest
            cxx: g++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --config Release
    - name: Docs
      run: cmake --build build --target docs
    - name: Smoke
      shell: bash
      run: |
        for t in hlcsg hlbsp hlvis hlrad ripent; do
          ./build/bin/$t 2>&1 | head -1 | grep -q "v3.5.1" || exit 1
        done
